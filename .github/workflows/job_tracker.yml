name: Job Tracker

on:
  schedule:
    # Runs at 8:00 AM EST every Monday and Wednesday
    - cron: "0 13 * * 1"   # Monday 13:00 UTC = 8:00 AM EST
    - cron: "0 13 * * 3"   # Wednesday 13:00 UTC = 8:00 AM EST
  workflow_dispatch:        # also lets you trigger manually from GitHub UI

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run job tracker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SHEETS_ID:  ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        run: |
          python job_tracker.py